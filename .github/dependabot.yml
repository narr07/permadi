version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Jakarta
    # Batasi HANYA 1 PR terbuka sekaligus agar tidak membanjiri Cloudflare
    open-pull-requests-limit: 1

    # Gabungkan semua update ke dalam 1 PR tunggal (Grouped PR)
    groups:
      all-dependencies:
        patterns:
          - '*'
        update-types:
          - patch
          - minor

    # Abaikan major breaking updates yang butuh migrasi manual teliti
    ignore:
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: better-sqlite3
        update-types: ['version-update:semver-major']
      - dependency-name: satori
        update-types: ['version-update:semver-major']

    labels:
      - dependencies
      - dependabot
      - skip-cf-build
    commit-message:
      prefix: chore(deps)
