name: Sinkronkan konten ke D1

# Runtime tidak lagi mengimpor dump Nuxt Content ke D1 (lihat nuxt.config.ts), jadi tabel konten
# diperbarui di sini setelah Workers Builds selesai men-deploy. Push dari workflow lain yang memakai
# GITHUB_TOKEN (auto-blog, seo-refresh) tidak memicu event push, jadi jadwal berkala menjadi cadangan.
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: sync-content-d1
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Dump diambil dari situs live; tunggu deploy commit ini selesai agar yang diambil adalah versi barunya
      - name: Tunggu deploy Workers Builds
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            state=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq '.check_runs[] | select(.name | startswith("Workers Builds")) | "\(.status) \(.conclusion)"' | head -1)
            echo "Workers Builds: ${state:-belum ada}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "Deploy tidak sukses, sinkronisasi dilewati"; echo "SKIP_SYNC=1" >> "$GITHUB_ENV"; exit 0 ;;
            esac
            sleep 20
          done
          echo "Deploy belum selesai setelah 20 menit, sinkronisasi dilewati"
          echo "SKIP_SYNC=1" >> "$GITHUB_ENV"

      - name: Sinkronkan tabel konten
        if: env.SKIP_SYNC != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-content-d1.mjs
