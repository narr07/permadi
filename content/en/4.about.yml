story_card:
  label: Philosophy & Story
  title: I'm Permadi, an elementary teacher and software craftsman based in Majalengka.
  lead: Holding an education degree from Universitas Pendidikan Indonesia (UPI), I channel analytical rigor into clean code (Nuxt, Flutter, Python, PHP) and balanced visual compositions.
  bio: Outside the classroom and terminal, I explore mathematical curiosities, design vector assets, and build interactive teaching tools for young learners.
