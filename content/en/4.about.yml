  title: I'm Permadi, an elementary teacher & digital craftsman based in Majalengka.
  lead: A Universitas Pendidikan Indonesia (UPI) graduate passionate about numbers, coding modern web & mobile apps (Nuxt, Flutter, Python, PHP), and crafting graphic design systems.
