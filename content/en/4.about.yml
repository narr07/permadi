journey:
  label: Background & Journey
  title: From the Classroom to Digital Systems
  description: My craft took root in the elementary classroom after completing my education degree at Universitas Pendidikan Indonesia (UPI). Teaching young students math nurtured a deep appreciation for clear, structured thinking—habits that translated directly into software engineering and graphic design. Today, I bring that pedagogical discipline to modern web architecture with Nuxt, cross-platform mobile apps with Flutter, and visual order across the Adobe suite.
