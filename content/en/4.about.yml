title: About Dinar Permadi Yusup | Teacher, Developer & Designer
description: A closer look at Dinar Permadi Yusup—an elementary school teacher in Majalengka uniting mathematical precision, modern software engineering (Nuxt, Flutter, Python, PHP), and visual craft.
headline: Calculating with care. Designing with purpose.
lead: Bridging classroom pedagogy, numerical clarity, modern software architecture, and typographic discipline.
