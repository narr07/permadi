title: About Dinar Permadi Yusup | Teacher, Developer & Designer
description: Get to know Dinar Permadi Yusup — an elementary school teacher and UPI alumnus blending mathematical logic, software engineering (Nuxt, Flutter, Python, PHP), and Adobe graphic design craft.
headline: Calculating with care. Designing with purpose.
journey:
  title: Journey & Background
  description: As an elementary school teacher graduated from Universitas Pendidikan Indonesia (UPI), my love for mathematics and logic naturally led me to code and graphic design. I blend pedagogical clarity with web & mobile development (Nuxt & Flutter) and Adobe Creative Cloud visual craft.
lead: Bridging primary education, mathematical logic, software engineering, and visual design craft.
principles:
  - title: Mathematical Logic & Precision
    description: Architecting efficient, clean, and modular code structures with consistent algorithmic logic.
  - title: Graphic Design Craft
    description: Composing visual layouts, harmonic color palettes, and expressive typography across the complete Adobe ecosystem.
  - title: Real-World Performance
    description: Ensuring every web app (Nuxt) and mobile app (Flutter) is lightning-fast, accessible, and delightful to use.
