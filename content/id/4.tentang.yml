principles:
  - title: Logika Numerik & Presisi
    description: Menyusun algoritma dan struktur kode yang efisien, rapi, dan modular di setiap lapisan arsitektur.
  - title: Kepekaan Desain Grafis
    description: Menyusun tata letak visual, harmoni warna, dan hierarki tipografi yang rapi serta nyaman dibaca.
  - title: Keandalan & Kegunaan Nyata
    description: Memastikan setiap aplikasi web maupun mobile selalu cepat dimuat, ringan, dan nyaman digunakan siapa saja.
journey:
  label: Latar Belakang & Perjalanan
  title: Dari Ruang Kelas ke Rekayasa Digital
  description: Perjalanan saya bermula dari ruang kelas sekolah dasar setelah lulus dari Universitas Pendidikan Indonesia (UPI). Mengajar matematika melatih saya berpikir terstruktur dan teliti, kebiasaan yang langsung terpakai saat menulis kode dan merancang grafis. Hari ini, saya menyatukan disiplin mengajar tersebut untuk membangun aplikasi web modern dengan Nuxt, aplikasi mobile dengan Flutter, serta tata visual yang tertib dan fungsional.
  primary_link_text: Buka Arsip Karya
