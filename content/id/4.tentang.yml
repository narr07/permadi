principles:
  - title: Logika Numerik & Presisi
    description: Menyusun algoritma dan struktur kode yang efisien, rapi, dan modular di setiap lapisan arsitektur.
  - title: Kepekaan Desain Grafis
    description: Mengolah tata letak visual, harmoni warna, dan hierarki tipografi dengan standar mutu tinggi lewat ekosistem Adobe.
  - title: Keandalan & Kegunaan Nyata
    description: Memastikan setiap aplikasi web (Nuxt) maupun mobile (Flutter) berjalan gegas, aksesibel, dan nyaman digunakan siapa saja.
journey:
  label: Latar Belakang & Perjalanan
  title: Dari Ruang Kelas ke Rekayasa Digital
  description: Perjalanan saya berakar dari ruang kelas sekolah dasar setelah menyelesaikan studi di Universitas Pendidikan Indonesia (UPI). Rutinitas mengajar matematika melatih ketahanan berpikir terstruktur—kebiasaan yang secara alami bermuara pada rekayasa perangkat lunak dan desain grafis. Hari ini, saya menyatukan disiplin pedagogi itu ke dalam arsitektur web modern dengan Nuxt, aplikasi lintas platform bersama Flutter, dan ketertiban visual lewat ekosistem Adobe.
  primary_link_text: Buka Arsip Karya
