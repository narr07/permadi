title: Tentang Dinar Permadi Yusup | Guru SD, Developer & Desainer
description: Catatan tentang Dinar Permadi Yusup, guru SD di Majalengka yang memadukan ketelitian matematika, arsitektur software (Nuxt, Flutter, Python, PHP), dan kepekaan desain visual.
headline: Menghitung dengan cermat. Merancang dengan penuh niat.
lead: Menghubungkan cara berpikir ruang kelas, ketelitian logika hitung, dan kerapian tata letak visual dalam setiap baris kode.
section_label: Profil & Filosofi
story_card:
  label: Filosofi & Profil
  title: Saya Permadi, guru sekolah dasar dan pengembang web dari Majalengka.
  lead: Berbekal latar belakang pendidikan dari Universitas Pendidikan Indonesia (UPI), saya menyalurkan ketelitian berpikir ke dalam baris kode (Nuxt, Flutter, Python, PHP) dan tata letak visual yang presisi.
  bio: Di luar ruang kelas dan teks editor, saya menghabiskan waktu mengeksplorasi konsep matematika, menyusun aset grafis, dan merancang media ajar interaktif untuk siswa.
  link_text: Lihat Arsip Studi Kasus
  link_to: /id/projek
